<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="shirajul islam shakur full-stack developer · bangladesh I build dynamic web apps with the MERN stack and PHP Laravel. These days I write a lot of TypeScript and PHP, building WordPress plugins at @Bit-Apps-Pro. I like work that starts messy and ends obvious: taking a tangled problem, finding the clean shape underneath it, and building that properly.">
