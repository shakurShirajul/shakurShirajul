e,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6570" text-anchor="end">5</text><text x="446" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" xml:space="preserve">  <tspan fill="#99D1CE">daily</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#8b949e">[</tspan><tspan fill="#ffd98a">"TypeScript"</tspan><tspan fill="#8b949e">,</tspan> <tspan fill="#ffd98a">"PHP"</tspan><tspan fill="#8b949e">,</tspan></text><text x="434" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6570" text-anchor="end">6</text><text x="446" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" xml:space="preserve">          <tspan fill="#ffd98a">"WordPress Plugins"</tspan><tspan fill="#8b949e">]</tspan><tspan fill="#8b949e">,</tspan></text><text x="434" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6570" text-anchor="end">7</text><text x="446" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" xml:space="preserve">  <tspan fill="#99D1CE">offDuty</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#8b949e">[</tspan><tspan fill="#ffd98a">"Gaming"</tspan><tspan fill="#8b949e">]</tspan><tspan fill="#8b949e">,</tspan></text><text x="434" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6570" text-anchor="end">8</text><text x="446" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" xml:space="preserve">  <tspan fill="#99D1CE">mantra</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#ffd98a">"Learn it, build it, ship it, repeat."</tspan><tspan fill="#8b949e">,</tspan></text><text x="434" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6570" text-anchor="end">9</text><text x="446" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" xml:space="preserve"><tspan fill="#8b949e">}</tspan><tspan fill="#8b949e">;</tspan></text>
